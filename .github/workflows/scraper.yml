name: Robô de Notícias

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        pip install requests beautifulsoup4
    
    - name: Executar robô
      run: python src/robofinal.py
    
    - name: Commit e push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add dados.json
        git diff --staged --quiet || git commit -m "🤖 Notícias atualizadas $(date +'%d/%m/%Y %H:%M')"
        git push origin main
